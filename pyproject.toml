[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv2pocketbook"
version = "0.1.0"
description = "Convert arXiv / alphaXiv papers to e-reader friendly EPUBs and send them to a PocketBook"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "EbookLib>=0.18",
  "Pillow>=10.1",
  "cairosvg>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arxiv2pb = "arxiv2pocketbook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arxiv2pocketbook = ["epub.css", "mathjax/package.json", "mathjax/package-lock.json", "mathjax/tex2svg.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
